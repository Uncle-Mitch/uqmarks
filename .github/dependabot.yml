version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/react-app"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns:
          - "*"
